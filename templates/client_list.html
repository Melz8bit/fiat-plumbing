<!DOCTYPE html>
<html lang="en">

<head>
    <title>Fiat Plumbing - Clients</title>

    {% include 'bootstrap.html' %}

    <style>
        * {
            font-family: "Raleway", sans-serif;
        }
    </style>
</head>

<body>
    {% include 'nav.html' %}
    <main>
    <div class="container pt-4">
        <div class="row align-items-center mb-3">
            <div class="col">
                <h2 class="mb-0">Client List</h2>
            </div>
            <div class="col-auto text-end">
                <a class="btn btn-primary btn-sm" type="button" href="{{url_for('create_client')}}">Add Client</a>
            </div>
        </div>

        <div class="list-group mb-4">
            {% for client in clients %}
            <a href="/client/{{ client['client_id'] }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <span class="fw-semibold">{{ client['name'] }}</span>
                <span class="badge bg-secondary ms-2">{{ client['project_count'] }} project{{ 's' if client['project_count'] != 1 }}</span>
            </a>
            {% endfor %}
        </div>

    </div>
    </main>

</body>

</html>
