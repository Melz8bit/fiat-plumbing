<!-- Project Info -->
<form method="get" action="{{url_for('search')}}" class="needs-validation mt-0 mb-4" novalidate>
    <!-- Search -->
    {% include 'search.html' %}
</form>
<div class="row align-items-center">
    <div class="col">
        <p class="fs-3 lh-1 mb-0">Projects</p>
    </div>
    <div class="col-auto text-end">
        <a class="btn btn-sm btn-primary" href="{{ url_for('project_add')}}">Add Project</a>
    </div>
</div>
<hr>
<div class="list-group mb-4">
    {% for project in projects %}
    <a href="/project/{{ project['project_id'] }}" class="list-group-item list-group-item-action">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <span class="text-muted small">#{{ project['project_id'] }}</span>
                <span class="ms-2 fw-semibold">{{ project['name'] }}</span>
            </div>
            <span class="badge bg-secondary ms-2 d-none d-md-inline">{{ project['status'] | title }}</span>
        </div>
        <div class="text-muted small mt-1">
            {{ project['client_name'] }} &middot; {{ project['status_date'].strftime('%m/%d/%Y') }}
        </div>
        <div class="text-muted small d-md-none">
            {{ project['status'] | title }}
        </div>
    </a>
    {% endfor %}
</div>
