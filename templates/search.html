<div class="input-group my-3">
    <button id="selectSearchBy" class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown"
        aria-expanded="false">
        {{ search_by if search_by else "Search By" }}
    </button>
    <input id="searchBy" type="text" name="search_by" value="{{ search_by if search_by else '' }}" style="display:none;">
    <ul class="dropdown-menu">
        <li><a id="allSearch" class="dropdown-item" href="#" onclick="changeSearchBy('universal')">Search All</a></li>
        <li><a id="projectAddress" class="dropdown-item" href="#" onclick="changeSearchBy('projectAddress')">Project Address</a></li>
        <li><a id="projectNumber" class="dropdown-item" href="#" onclick="changeSearchBy('projectNumber')">Project Number</a></li>
        <li><a id="clientName" class="dropdown-item" href="#" onclick="changeSearchBy('clientName')">Client Name</a></li>
        <li><a id="projectName" class="dropdown-item" href="#" onclick="changeSearchBy('projectName')">Job Name</a></li>
    </ul>
    <script>
        function changeSearchBy(item) {
            const selectedText = document.getElementById(item).innerText;
            document.getElementById("selectSearchBy").innerText = selectedText;
            document.getElementById("searchBy").value = selectedText;
        }
    </script>

    {% if search_criteria %}
    <input type="text" class="form-control" placeholder="Search criteria" aria-label="Search criteria"
        value="{{ search_criteria }}" aria-describedby="button-search" name="search_criteria" required>
    {% else %}
    <input id="searchCriteria" type="text" class="form-control" placeholder="Search criteria"
        aria-label="Search criteria" aria-describedby="button-search" name="search_criteria" required>
    {% endif %}

    <button class="btn btn-outline-primary" type="submit" id="button-search">Search</button>
</div>

<!-- <div class="invalid-feedback">
    Please enter a search criteria.
</div> -->


<script type="text/javascript">
    (function () {
        'use strict'

        // Fetch all the forms we want to apply custom Bootstrap validation styles to
        var forms = document.querySelectorAll('.needs-validation')

        // Loop over them and prevent submission
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>
